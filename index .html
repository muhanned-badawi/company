h1{font-size:1.3rem;margin:0}h2{font-size:1.05rem;margin:0 0 10px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}.row>.n{flex:none;min-width:0}
.muted{color:var(--muted);font-size:.85rem}.err{color:var(--bad)}

.item:last-child{border:0}.click{cursor:pointer}
.bdg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:#26324a}

.tools{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.tools button,.tools select,.tools input{width:auto;margin:0;padding:5px 9px}
.ed{min-height:220px;background:#fff;color:#111;border-radius:10px;padding:12px;overflow:auto}
.rep{background:#fff;color:#111;border-radius:10px;padding:14px;overflow:auto}.rep img,.ed img{max-width:100%}

.login{max-width:420px;margin:7vh auto;padding:0 14px}

.dot{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem;margin-inline-start:6px}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
